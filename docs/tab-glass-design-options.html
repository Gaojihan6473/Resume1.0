<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>简历顶部 Tab 液态玻璃设计方案</title>
  <style>
    :root {
      --slate-900: #0f172a;
      --slate-700: #334155;
      --slate-500: #64748b;
      --slate-400: #94a3b8;
      --slate-200: #e2e8f0;
      --slate-100: #f1f5f9;
      --blue-600: #2563eb;
      --blue-500: #3b82f6;
      --cyan-500: #06b6d4;
      --emerald-500: #10b981;
      --violet-500: #8b5cf6;
      --amber-400: #f59e0b;
      font-family: Inter, "SF Pro Display", "Segoe UI", system-ui, sans-serif;
      color: var(--slate-900);
      background:
        radial-gradient(circle at 14% 0%, rgba(59, 130, 246, 0.18), transparent 28rem),
        radial-gradient(circle at 86% 12%, rgba(16, 185, 129, 0.12), transparent 30rem),
        linear-gradient(135deg, #f7fbff 0%, #eef4fb 52%, #f8fafc 100%);
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 32px;
    }

    main {
      width: min(1120px, 100%);
      margin: 0 auto;
    }

    header {
      margin-bottom: 22px;
    }

    h1 {
      margin: 0;
      font-size: 24px;
      letter-spacing: 0;
    }

    .note {
      margin: 8px 0 0;
      font-size: 13px;
      line-height: 1.7;
      color: var(--slate-500);
    }

    .option {
      margin-top: 22px;
      overflow: hidden;
      border: 1px solid rgba(203, 213, 225, 0.72);
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.7);
      box-shadow: 0 18px 55px rgba(15, 23, 42, 0.09);
      backdrop-filter: blur(22px);
    }

    .option-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      min-height: 52px;
      padding: 0 18px;
      border-bottom: 1px solid rgba(226, 232, 240, 0.78);
      background: rgba(255, 255, 255, 0.58);
    }

    .option-title {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 700;
      color: var(--slate-700);
    }

    .option-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 25px;
      height: 25px;
      border-radius: 999px;
      color: #fff;
      font-size: 12px;
      background: linear-gradient(135deg, var(--blue-500), var(--cyan-500));
      box-shadow: 0 8px 18px rgba(59, 130, 246, 0.24);
    }

    .option-copy {
      margin: 0;
      font-size: 12px;
      color: var(--slate-500);
    }

    .mock {
      position: relative;
      height: 214px;
      background:
        linear-gradient(90deg, rgba(248, 250, 252, 0.98) 0 46%, rgba(226, 232, 240, 0.82) 46% 100%),
        #f8fafc;
    }

    .topbar {
      height: 48px;
      border-bottom: 1px solid rgba(226, 232, 240, 0.78);
      background: rgba(255, 255, 255, 0.88);
      backdrop-filter: blur(18px);
    }

    .work-left {
      width: 46%;
      min-width: 530px;
      height: calc(100% - 48px);
      border-right: 1px solid rgba(226, 232, 240, 0.8);
      background: rgba(248, 250, 252, 0.84);
      padding: 18px 20px;
    }

    .paper {
      position: absolute;
      top: 68px;
      right: 78px;
      width: 210px;
      height: 116px;
      border-radius: 2px;
      background: rgba(255, 255, 255, 0.94);
      box-shadow: 0 12px 32px rgba(15, 23, 42, 0.14);
    }

    .paper::before,
    .paper::after {
      content: "";
      position: absolute;
      left: 26px;
      right: 26px;
      height: 5px;
      border-radius: 999px;
      background: var(--slate-200);
    }

    .paper::before {
      top: 28px;
      width: 56%;
    }

    .paper::after {
      top: 48px;
      box-shadow: 0 18px 0 var(--slate-200), 0 36px 0 var(--slate-200);
    }

    .section-card {
      height: 52px;
      margin-top: 16px;
      border: 1px solid rgba(226, 232, 240, 0.9);
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.86);
      box-shadow: 0 8px 20px rgba(15, 23, 42, 0.05);
    }

    .glass-icon {
      width: 16px;
      height: 16px;
      flex: 0 0 auto;
    }

    .sr-label {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip: rect(0 0 0 0);
      white-space: nowrap;
    }

    input {
      min-width: 0;
      border: 0;
      outline: 0;
      color: inherit;
      font: inherit;
      background: transparent;
    }

    button {
      font: inherit;
      cursor: pointer;
    }

    .concept-a {
      display: grid;
      grid-template-columns: minmax(168px, 1fr) auto auto;
      align-items: center;
      gap: 5px;
      width: 100%;
      max-width: 720px;
      min-height: 54px;
      padding: 6px;
      border: 1px solid rgba(255, 255, 255, 0.86);
      border-radius: 18px;
      background:
        linear-gradient(135deg, rgba(255, 255, 255, 0.78), rgba(239, 246, 255, 0.52)),
        rgba(255, 255, 255, 0.56);
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.86),
        inset 0 -1px 0 rgba(148, 163, 184, 0.12),
        0 16px 38px rgba(37, 99, 235, 0.13);
      backdrop-filter: blur(22px) saturate(1.3);
    }

    .a-title {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
      height: 42px;
      padding: 0 13px;
      border: 1px solid rgba(37, 99, 235, 0.14);
      border-radius: 14px;
      color: var(--slate-700);
      background:
        linear-gradient(135deg, rgba(239, 246, 255, 0.82), rgba(255, 255, 255, 0.5));
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.92);
    }

    .a-title small {
      flex: 0 0 auto;
      color: var(--slate-400);
      font-size: 12px;
      font-weight: 600;
    }

    .a-title input {
      width: 100%;
      text-align: right;
      font-size: 14px;
      font-weight: 700;
    }

    .a-tab {
      position: relative;
      height: 42px;
      min-width: 96px;
      border: 0;
      border-radius: 14px;
      padding: 0 16px;
      color: var(--slate-500);
      background: transparent;
      transition: transform 180ms ease, color 180ms ease, background 180ms ease;
    }

    .a-tab.active {
      color: #fff;
      background:
        linear-gradient(135deg, rgba(37, 99, 235, 0.98), rgba(6, 182, 212, 0.88));
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.32),
        0 10px 22px rgba(37, 99, 235, 0.28);
    }

    .a-tab:hover {
      transform: translateY(-1px);
    }

    .concept-b {
      position: relative;
      display: flex;
      align-items: center;
      gap: 7px;
      width: 100%;
      max-width: 720px;
      min-height: 60px;
      padding: 7px;
      border: 1px solid rgba(203, 213, 225, 0.54);
      border-radius: 999px;
      background:
        linear-gradient(145deg, rgba(255, 255, 255, 0.88), rgba(241, 248, 255, 0.42) 46%, rgba(236, 253, 245, 0.36)),
        rgba(255, 255, 255, 0.42);
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.95),
        inset 0 -1px 0 rgba(15, 23, 42, 0.06),
        inset 0 0 0 1px rgba(255, 255, 255, 0.56),
        0 18px 44px rgba(15, 23, 42, 0.11),
        0 30px 76px rgba(37, 99, 235, 0.16),
        0 0 34px rgba(14, 165, 233, 0.1);
      overflow: hidden;
      backdrop-filter: blur(34px) saturate(1.55) contrast(1.05);
    }

    .concept-b::before {
      content: "";
      position: absolute;
      inset: 1px;
      border-radius: inherit;
      background:
        linear-gradient(112deg, rgba(255, 255, 255, 0.92), rgba(255, 255, 255, 0.14) 28%, rgba(255, 255, 255, 0) 54%),
        linear-gradient(248deg, rgba(125, 211, 252, 0.18), rgba(255, 255, 255, 0) 42%);
      pointer-events: none;
      mix-blend-mode: screen;
    }

    .concept-b::after {
      content: "";
      position: absolute;
      inset: 7px 8px;
      border: 1px solid rgba(255, 255, 255, 0.62);
      border-radius: inherit;
      box-shadow:
        inset 12px 0 22px rgba(255, 255, 255, 0.5),
        inset -14px -10px 26px rgba(59, 130, 246, 0.08);
      pointer-events: none;
    }

    .b-name {
      position: relative;
      z-index: 1;
      display: flex;
      align-items: center;
      gap: 9px;
      flex: 1 1 auto;
      min-width: 190px;
      height: 46px;
      padding: 0 16px 0 14px;
      border-radius: 999px;
      color: var(--slate-700);
      background:
        linear-gradient(140deg, rgba(255, 255, 255, 0.74), rgba(240, 249, 255, 0.28) 60%, rgba(236, 253, 245, 0.22));
      box-shadow:
        inset 0 0 0 1px rgba(59, 130, 246, 0.13),
        inset 0 1px 0 rgba(255, 255, 255, 0.92),
        inset 0 -10px 22px rgba(37, 99, 235, 0.035);
    }

    .b-name span {
      flex: 0 0 auto;
      font-size: 12px;
      font-weight: 700;
      color: var(--cyan-500);
    }

    .b-name input {
      width: 100%;
      font-size: 14px;
      font-weight: 800;
    }

    .b-divider {
      position: relative;
      z-index: 1;
      width: 1px;
      height: 26px;
      border-radius: 999px;
      background: linear-gradient(180deg, transparent, rgba(148, 163, 184, 0.45), transparent);
    }

    .b-tab {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 116px;
      height: 46px;
      border: 0;
      border-radius: 999px;
      color: var(--slate-500);
      background: transparent;
      white-space: nowrap;
      position: relative;
      z-index: 1;
      font-weight: 700;
      transition: transform 180ms ease, background 180ms ease, color 180ms ease;
    }

    .b-tab.active {
      color: var(--blue-600);
      background:
        linear-gradient(145deg, rgba(255, 255, 255, 0.82), rgba(239, 246, 255, 0.46) 56%, rgba(255, 255, 255, 0.68));
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.96),
        inset 0 -1px 0 rgba(15, 23, 42, 0.05),
        inset 0 0 0 1px rgba(255, 255, 255, 0.64),
        0 10px 26px rgba(37, 99, 235, 0.17),
        0 16px 34px rgba(14, 165, 233, 0.11);
    }

    .b-tab.active::before {
      content: "";
      position: absolute;
      inset: 3px 9px auto;
      height: 9px;
      border-radius: 999px;
      background: linear-gradient(90deg, rgba(255, 255, 255, 0), rgba(255, 255, 255, 0.82), rgba(255, 255, 255, 0));
      opacity: 0.9;
      pointer-events: none;
    }

    .b-tab:not(.active):hover {
      color: var(--slate-700);
      background: rgba(255, 255, 255, 0.42);
    }

    .concept-c {
      position: relative;
      display: grid;
      grid-template-columns: minmax(178px, 1fr) repeat(2, 112px);
      gap: 8px;
      width: 100%;
      max-width: 720px;
      min-height: 64px;
      padding: 8px;
      border: 1px solid rgba(255, 255, 255, 0.86);
      border-radius: 20px;
      background:
        linear-gradient(120deg, rgba(255, 255, 255, 0.82), rgba(236, 253, 245, 0.34) 48%, rgba(239, 246, 255, 0.58)),
        rgba(255, 255, 255, 0.48);
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.95),
        inset 0 -1px 0 rgba(15, 23, 42, 0.05),
        0 18px 44px rgba(2, 132, 199, 0.12);
      backdrop-filter: blur(24px) saturate(1.4);
    }

    .concept-c::before {
      content: "";
      position: absolute;
      inset: 7px auto 7px 7px;
      width: calc(100% - 238px);
      border-radius: 15px;
      background:
        linear-gradient(135deg, rgba(255, 255, 255, 0.72), rgba(240, 249, 255, 0.24));
      box-shadow: inset 0 0 0 1px rgba(6, 182, 212, 0.14);
      pointer-events: none;
    }

    .c-name {
      position: relative;
      z-index: 1;
      display: grid;
      grid-template-columns: auto minmax(0, 1fr) auto;
      align-items: center;
      gap: 10px;
      min-width: 0;
      height: 48px;
      padding: 0 14px;
      color: var(--slate-700);
    }

    .c-label {
      display: flex;
      align-items: center;
      gap: 7px;
      color: var(--slate-400);
      font-size: 12px;
      font-weight: 700;
    }

    .c-name input {
      width: 100%;
      text-align: center;
      font-size: 14px;
      font-weight: 800;
    }

    .c-edit {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 26px;
      height: 26px;
      border-radius: 999px;
      color: var(--slate-500);
      background: rgba(255, 255, 255, 0.72);
      box-shadow: inset 0 0 0 1px rgba(203, 213, 225, 0.68);
    }

    .c-tab {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      height: 48px;
      border: 0;
      border-radius: 15px;
      color: var(--slate-500);
      background: rgba(255, 255, 255, 0.28);
      transition: transform 180ms ease, box-shadow 180ms ease, color 180ms ease, background 180ms ease;
    }

    .c-tab strong {
      font-size: 13px;
      font-weight: 800;
    }

    .c-tab small {
      font-size: 10px;
      color: currentColor;
      opacity: 0.62;
    }

    .c-tab.active {
      color: #fff;
      background:
        linear-gradient(135deg, rgba(37, 99, 235, 0.95), rgba(16, 185, 129, 0.86));
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.34),
        0 12px 28px rgba(16, 185, 129, 0.22);
    }

    .c-tab:hover {
      transform: translateY(-1px);
    }

    @media (max-width: 900px) {
      body {
        padding: 18px;
      }

      .mock {
        height: 248px;
      }

      .work-left {
        width: 100%;
        min-width: 0;
        border-right: 0;
      }

      .paper {
        display: none;
      }

      .concept-a,
      .concept-c {
        grid-template-columns: 1fr;
      }

      .concept-b {
        flex-wrap: wrap;
        border-radius: 20px;
      }

      .b-divider {
        display: none;
      }

      .b-tab {
        flex: 1;
      }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>绿框区域三版设计稿</h1>
      <p class="note">三版都把“简历名称 / 简历编辑 / JD分析”收进同一个液态玻璃模块里；第一个是可编辑标题，后两个是导航 tab。</p>
    </header>

    <section class="option">
      <div class="option-head">
        <div class="option-title"><span class="option-badge">A</span>一体式胶囊</div>
        <p class="option-copy">最接近当前布局，改动小，标题像输入区，tab 像同组操作。</p>
      </div>
      <div class="mock">
        <div class="topbar"></div>
        <div class="work-left">
          <div class="concept-a" role="group" aria-label="方案 A">
            <label class="a-title">
              <svg class="glass-icon" viewBox="0 0 24 24" fill="none" stroke="#3b82f6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" />
                <path d="M14 2v6h6" />
                <path d="M8 13h8" />
                <path d="M8 17h5" />
              </svg>
              <small>简历名称</small>
              <input value="暑期简历2.0" aria-label="简历名称" />
            </label>
            <button class="a-tab active" type="button">简历编辑</button>
            <button class="a-tab" type="button">JD分析</button>
          </div>
          <div class="section-card"></div>
        </div>
        <div class="paper"></div>
      </div>
    </section>

    <section class="option">
      <div class="option-head">
        <div class="option-title"><span class="option-badge">B</span>悬浮玻璃岛</div>
        <p class="option-copy">更接近 Apple 式液态玻璃：更厚的透明边缘、更宽的柔光和更清晰的折射层。</p>
      </div>
      <div class="mock">
        <div class="topbar"></div>
        <div class="work-left">
          <div class="concept-b" role="group" aria-label="方案 B">
            <label class="b-name">
              <svg class="glass-icon" viewBox="0 0 24 24" fill="none" stroke="#06b6d4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M12 20h9" />
                <path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z" />
              </svg>
              <span>名称</span>
              <input value="暑期简历2.0" aria-label="简历名称" />
            </label>
            <span class="b-divider" aria-hidden="true"></span>
            <button class="b-tab active" type="button">
              简历编辑
            </button>
            <button class="b-tab" type="button">
              JD分析
            </button>
          </div>
          <div class="section-card"></div>
        </div>
        <div class="paper"></div>
      </div>
    </section>

    <section class="option">
      <div class="option-head">
        <div class="option-title"><span class="option-badge">C</span>三段晶片</div>
        <p class="option-copy">区分最明显：标题是可编辑晶片，两个 tab 是状态卡，适合强调 JD 分析入口。</p>
      </div>
      <div class="mock">
        <div class="topbar"></div>
        <div class="work-left">
          <div class="concept-c" role="group" aria-label="方案 C">
            <label class="c-name">
              <span class="c-label">
                <svg class="glass-icon" viewBox="0 0 24 24" fill="none" stroke="#64748b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7z" />
                  <path d="M14 2v5h5" />
                </svg>
                简历名称
              </span>
              <input value="暑期简历2.0" aria-label="简历名称" />
              <span class="c-edit" aria-hidden="true">
                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M12 20h9" />
                  <path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z" />
                </svg>
              </span>
            </label>
            <button class="c-tab active" type="button">
              <strong>简历编辑</strong>
              <small>Resume</small>
            </button>
            <button class="c-tab" type="button">
              <strong>JD分析</strong>
              <small>Match</small>
            </button>
          </div>
          <div class="section-card"></div>
        </div>
        <div class="paper"></div>
      </div>
    </section>
  </main>
</body>
</html>
